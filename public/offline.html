<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2A41CB">
    <title>Luber sedang offline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f7f8fa; color: #0c2541; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
      main { max-width: 360px; padding: 32px 24px; border: 1px solid #e2e8f0; border-radius: 16px; background: white; box-shadow: 0 8px 30px #0c25411a; }
      img { width: 120px; height: auto; margin-bottom: 20px; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 0; color: #64748b; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="Luber">
      <h1>Koneksi sedang tidak tersedia</h1>
      <p>Hubungkan perangkat ke internet untuk membuka data dan mencatat transaksi.</p>
    </main>
  </body>
</html>
